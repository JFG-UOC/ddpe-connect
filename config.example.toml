[ddpe]
# Required unless DDPE_SPARK_CONNECT_URL or builder.remote(...) is used.
spark_connect_url = "spark-connect.example:443"
# Omit this setting when the server certificate chains to a system-trusted CA.
spark_connect_ca = "/path/to/ddpe-spark-ca.pem"

[ddpe.auth]
token_url = "https://keycloak.example/auth/realms/ddae/protocol/openid-connect/token"
client_id = "ddpe-client"
client_secret = ""
username = ""
password = ""
scope = "openid"
# Omit when the Keycloak certificate chains to a system-trusted CA.
keycloak_ca = "/path/to/keycloak-ca.pem"
# Set false only for isolated development; independent from the Spark CA.
verify_ssl = true
timeout_seconds = 30
refresh_skew_seconds = 60

[ddpe.spark]
"spark.sql.shuffle.partitions" = "16"
