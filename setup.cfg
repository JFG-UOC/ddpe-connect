[metadata]
name = ddpe-connect
version = 0.1.2
description = Authenticated Spark Connect client for Dell Data Processing Engine
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL-3.0-only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    requests>=2.31,<3
    pyspark[connect]>=3.5,<4.0
    tomli>=2.0.1,<3; python_version < "3.11"

[options.packages.find]
where = src
include =
    ddpe
    ddpe.*
